env: hover_state
algo: ppo
train_seeds: [0, 1]
eval_seeds: [100, 101]
num_epochs: 30
num_steps_per_epoch: 128
num_envs: 256
learning_rate: 0.0003
eval_episodes: 1
output_dir: artifacts/acceptance_results/hover_state/ppo
thresholds:
  min_reward_delta: 0.05
  primary_metric_name: mean_reward
  primary_metric_direction: max
  primary_metric_threshold: -200.0
  primary_metric_vs_random_delta: 0.0
train_kwargs:
  unroll_length: 16
  num_minibatches: 8
  batch_size: 512
  num_updates_per_batch: 4
  run_evals: false
  normalize_observations: true
