env: gate_crossing
algo: ppo
train_seeds: [0, 1]
eval_seeds: [100, 101]
num_epochs: 30
num_steps_per_epoch: 200
num_envs: 256
learning_rate: 0.0003
eval_episodes: 2
output_dir: artifacts/acceptance_results/gate_crossing/ppo
thresholds:
  min_reward_delta: 0.05
  primary_metric_name: gate_progress
  primary_metric_direction: max
  primary_metric_threshold: 0.34
  primary_metric_vs_random_delta: 0.05
  additional_metrics:
    - name: collision
      direction: min
      threshold: 0.5
      vs_random_delta: 0.0
train_kwargs:
  unroll_length: 20
  num_minibatches: 8
  batch_size: 512
  num_updates_per_batch: 4
  run_evals: false
  normalize_observations: true
