env: hover_state
max_steps_in_episode: 1000
dt: 0.02
delay: 0.02
reward_sharpness: 1.0
action_penalty_weight: 1.0
sensor_modes:
  default: state
  available: [state, rangefinder, rgb_depth]
  state:
    observation: proprioceptive_state
  rangefinder:
    sensors: [rangefinder_front]
    max_range: 10.0
  rgb_depth:
    camera: track
    width: 64
    height: 48
    differentiable: false
